<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf2" />
    <!-- Nothing is fetched from another origin: no CDN, no fonts from Google,
         no analytics. frame-ancestors is deliberately absent — browsers ignore
         it in a <meta> policy, and GitHub Pages cannot set response headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ciparu dārzs" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./ciparu-darzs-icon-192.png" />
    <meta name="description" content="Piecas draudzīgas atmiņas un matemātikas spēles bērniem no 2 līdz 6 gadiem." />
    <title>Ciparu dārzs</title>
    <!-- KidMindPath design system, copied into public/shared (see README).
         Must load before the app's own CSS, which resolves var(--kmp-*). -->
    <link rel="stylesheet" href="./shared/kidmindpath-fonts.css" />
    <link rel="stylesheet" href="./shared/kidmindpath-tokens.css" />
    <link rel="stylesheet" href="./shared/kidmindpath-ui.css" />
    <!-- Classic script: window.KMP must exist before the app module runs. -->
    <script src="./shared/kmp.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
